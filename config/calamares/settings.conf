---
modules-search: [ local ]
instances:
  - id: blueos-cleanup
    module: shellprocess
    config: blueos-cleanup.conf
sequence:
  - show: [ welcome, locale, keyboard, partition, users, summary ]
  - exec: [ partition, mount, unpackfs, machineid, fstab, locale, keyboard,
            localecfg, users, displaymanager, networkcfg, hwclock, packages,
            shellprocess@blueos-cleanup,
            initramfs, grubcfg, bootloader, umount ]
  - show: [ finished ]
branding: blueos
prompt-install: true
dont-chroot: false
disable-cancel: false
disable-cancel-during-exec: true
