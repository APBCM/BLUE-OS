---
efi:
  mountPoint: /boot/efi
  recommendedSize: 512MiB
  minimumSize: 256MiB
userSwapChoices: [ none, file ]
initialSwapChoice: file
defaultPartitionTableType: gpt
defaultFileSystemType: ext4
availableFileSystemTypes: [ ext4 ]
partitionLayout:
  - name: blue_os_root
    filesystem: ext4
    mountPoint: /
    size: 100%
