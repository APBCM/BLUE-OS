UI menu.c32
PROMPT 0
TIMEOUT 80
DEFAULT live
MENU TITLE BLUE OS  |  Ubuntu 24.04 LTS
MENU COLOR title 1;36;40 #ff00a8ff #ff0b132b std
LABEL live
  MENU LABEL Blue OS - Try / Install
  KERNEL /casper/vmlinuz
  APPEND initrd=/casper/initrd boot=casper username=blue hostname=blue-os quiet splash ---
LABEL safe
  MENU LABEL Blue OS - Safe graphics (VMware)
  KERNEL /casper/vmlinuz
  APPEND initrd=/casper/initrd boot=casper username=blue hostname=blue-os nomodeset systemd.unit=graphical.target ---
