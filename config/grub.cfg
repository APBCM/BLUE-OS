search --no-floppy --set=root --file /casper/filesystem.squashfs
set timeout=8
set default=0
set color_normal=light-blue/black
set color_highlight=white/blue
menuentry 'Blue OS | Try / Install' {
    linux /casper/vmlinuz boot=casper username=blue hostname=blue-os quiet splash ---
    initrd /casper/initrd
}
menuentry 'Blue OS | Safe graphics (VMware)' {
    linux /casper/vmlinuz boot=casper username=blue hostname=blue-os nomodeset systemd.unit=graphical.target ---
    initrd /casper/initrd
}
