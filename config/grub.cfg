search --no-floppy --set=root --file /casper/filesystem.squashfs
set timeout=8
set default=0
set color_normal=light-blue/black
set color_highlight=white/blue
menuentry 'Blue OS  |  Live desktop / installer' {
    linux /casper/vmlinuz boot=casper username=blueos hostname=blue-os quiet splash ---
    initrd /casper/initrd
}
menuentry 'Blue OS  |  Safe graphics' {
    linux /casper/vmlinuz boot=casper username=blueos hostname=blue-os nomodeset ---
    initrd /casper/initrd
}
