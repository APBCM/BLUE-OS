name: Build Blue OS ISO & Packages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          df -h

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache APT archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-noble-amd64-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: apt-noble-amd64-

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libstdc++-12-dev dpkg-dev debootstrap squashfs-tools \
            xorriso grub-efi-amd64-bin grub-common isolinux syslinux-common \
            mtools dosfstools

      - name: Bootstrap and Build Flutter Apps
        run: |
          chmod +x tools/*.sh
          ./tools/build_all.sh

      - name: Check free space
        run: |
          df -h

      - name: Build Blue OS ISO
        run: |
          chmod +x build_blue_os.sh
          sudo ./build_blue_os.sh

      - name: Publish Blue OS rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling
          name: Blue OS rolling release
          prerelease: true
          make_latest: false
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            dist/*.deb
            blue-os-x86_64.iso
            blue-os-x86_64.iso.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
