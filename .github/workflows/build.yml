name: Build Blue OS ISO & Packages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libstdc++-12-dev dpkg-dev debootstrap squashfs-tools \
            xorriso grub-efi-amd64-bin grub-common isolinux syslinux-common \
            mtools dosfstools

      - name: Bootstrap and Build Flutter Apps
        run: |
          chmod +x tools/*.sh
          ./tools/bootstrap.sh
          ./tools/build_all.sh

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          df -h

      - name: Build Blue OS ISO
        run: |
          chmod +x build_blue_os.sh
          sudo ./build_blue_os.sh

      - name: Upload Debian Packages
        uses: actions/upload-artifact@v4
        with:
          name: blue-os-deb-packages
          path: dist/*.deb

      - name: Upload Blue OS ISO Image
        uses: actions/upload-artifact@v4
        with:
          name: blue-os-x86_64-iso
          path: |
            blue-os-x86_64.iso
            blue-os-x86_64.iso.sha256
